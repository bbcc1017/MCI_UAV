<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">MCI UAV — Disaster digital twin research</title>
  <desc id="desc">A bright city map with three-dimensional buildings, an orange incident zone, blue UAV flight routes and a hospital, beside the MCI UAV research title.</desc>
  <defs>
