behaviors:
  RoadDriving:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0001
      beta: 0.0004
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: nature_cnn
      memory:
        sequence_length: 64
        memory_size: 256
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 20
    checkpoint_interval: 250000
    max_steps: 12000000
    time_horizon: 256
    summary_freq: 10000
environment_parameters:
  route_distance_m:
    curriculum:
    - name: L0_LaneKeep
      completion_criteria: &id001
        measure: progress
        behavior: RoadDriving
        signal_smoothing: true
        min_lesson_length: 500
        threshold: 0.08
      value: 250.0
    - name: L1_Traffic
      completion_criteria: &id002
        measure: progress
        behavior: RoadDriving
        signal_smoothing: true
        min_lesson_length: 600
        threshold: 0.2
      value: 250.0
    - name: L2_Signals
      completion_criteria: &id003
        measure: progress
        behavior: RoadDriving
        signal_smoothing: true
        min_lesson_length: 700
        threshold: 0.38
      value: 450.0
    - name: L3_Pedestrians
      completion_criteria: &id004
        measure: progress
        behavior: RoadDriving
        signal_smoothing: true
        min_lesson_length: 700
        threshold: 0.56
      value: 450.0
    - name: L4_Full
      completion_criteria: &id005
        measure: progress
        behavior: RoadDriving
        signal_smoothing: true
        min_lesson_length: 800
        threshold: 0.78
      value: 650.0
    - name: L5_Long
      value: 900.0
  npc_density:
    curriculum:
    - name: L0_LaneKeep
      completion_criteria: *id001
      value: 0.0
    - name: L1_Traffic
      completion_criteria: *id002
      value: 40.0
    - name: L2_Signals
      completion_criteria: *id003
      value: 70.0
    - name: L3_Pedestrians
      completion_criteria: *id004
      value: 90.0
    - name: L4_Full
      completion_criteria: *id005
      value: 110.0
    - name: L5_Long
      value: 90.0
  ped_density:
    curriculum:
    - name: L0_LaneKeep
      completion_criteria: *id001
      value: 0.0
    - name: L1_Traffic
      completion_criteria: *id002
      value: 0.0
    - name: L2_Signals
      completion_criteria: *id003
      value: 25.0
    - name: L3_Pedestrians
      completion_criteria: *id004
      value: 45.0
    - name: L4_Full
      completion_criteria: *id005
      value: 45.0
    - name: L5_Long
      value: 45.0
  terminate_on_red:
    curriculum:
    - name: L0_LaneKeep
      completion_criteria: *id001
      value: 0.0
    - name: L1_Traffic
      completion_criteria: *id002
      value: 0.0
    - name: L2_Signals
      completion_criteria: *id003
      value: 1.0
    - name: L3_Pedestrians
      completion_criteria: *id004
      value: 1.0
    - name: L4_Full
      completion_criteria: *id005
      value: 1.0
    - name: L5_Long
      value: 1.0
  parked_fraction:
    curriculum:
    - name: L0_LaneKeep
      completion_criteria: *id001
      value: 0.0
    - name: L1_Traffic
      completion_criteria: *id002
      value: 0.02
    - name: L2_Signals
      completion_criteria: *id003
      value: 0.04
    - name: L3_Pedestrians
      completion_criteria: *id004
      value: 0.06
    - name: L4_Full
      completion_criteria: *id005
      value: 0.08
    - name: L5_Long
      value: 0.08
  spawn_randomization: 1.0
